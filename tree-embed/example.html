<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tree of Hope — embed example</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f4f1ea; color: #1a1a1a; }
    section { max-width: 1000px; margin: 3rem auto; padding: 0 1rem; }
    #tree { height: 70vh; min-height: 420px; border-radius: 12px; overflow: hidden; }
  </style>
</head>
<body>
  <section>
    <h1>Any website</h1>
    <p>The tree below is mounted into a normal &lt;div&gt;. Drag to rotate.</p>
    <div id="tree"></div>
  </section>

  <script type="module">
    import { mountTree } from './tree-of-hope.js';
    mountTree(document.getElementById('tree'));
    // Transparent background (blends with your page):
    // mountTree(el, { background: null });
  </script>
</body>
</html>
